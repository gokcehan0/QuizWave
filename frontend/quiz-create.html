<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center">
  <div class="w-full max-w-md p-2 sm:p-4 md:p-6 rounded-lg bg-gray-800 shadow-lg">
    <h1 class="text-xl sm:text-2xl font-bold mb-3 sm:mb-4 text-center">Create Quiz</h1>
    <form id="quizForm" class="flex flex-col gap-2 sm:gap-3">
      <input type="text" id="quizName" placeholder="Quiz Name" class="p-2 rounded bg-gray-700 text-white w-full text-base">
      <div id="questions"></div>
      <button type="button" id="addQuestion" class="bg-slate-600 hover:bg-slate-700 p-2 rounded w-full text-base">Add Question</button>
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 p-2 rounded w-full text-base">Create Quiz</button>
      <div id="msg" class="mt-2 text-sm"></div>
    </form>
    <a href="main.html" class="block mt-3 sm:mt-4 text-blue-400 hover:underline text-center text-base sm:text-lg">Dashboard</a>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/quiz-create.js"></script>
</body>
</html>
