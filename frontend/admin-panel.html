<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen">
  <!-- Navigation -->
  <nav class="bg-gray-800/80 backdrop-blur-md shadow-xl border-b border-gray-700 sticky top-0 z-50">
    <div class="container mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <h1 class="text-2xl font-bold bg-gradient-to-r from-red-400 to-purple-500 bg-clip-text text-transparent">
            🛡️ Admin Panel
          </h1>
        </div>
        <div class="flex items-center space-x-4">
          <a href="main.html" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors duration-200">
            Dashboard
          </a>
          <span id="user-info" class="text-gray-300"></span>
          <button id="logout-btn" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 rounded-lg transition-colors duration-200">
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mx-auto px-6 py-8">
    <div id="admin-content">
      <!-- Tabs -->
      <div class="flex space-x-2 mb-6 overflow-x-auto">
        <button class="tab-btn active bg-blue-600 px-6 py-3 rounded-lg font-semibold transition-all duration-200 hover:bg-blue-700 whitespace-nowrap" data-tab="users-tab">
          👥 Users
        </button>
        <button class="tab-btn bg-gray-700 px-6 py-3 rounded-lg font-semibold transition-all duration-200 hover:bg-gray-600 whitespace-nowrap" data-tab="quizzes-tab">
          📝 All Quizzes
        </button>
        <button class="tab-btn bg-gray-700 px-6 py-3 rounded-lg font-semibold transition-all duration-200 hover:bg-gray-600 whitespace-nowrap" data-tab="stats-tab">
          📈 Statistics
        </button>
      </div>

      <!-- Tab Contents -->
      <div id="users-tab" class="tab-content">
        <div class="mb-6">
          <h2 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            User Management
          </h2>
          <p class="text-gray-400">Manage user accounts, suspend, reset passwords, and delete users.</p>
        </div>
        <div id="users-list"></div>
      </div>

      <div id="quizzes-tab" class="tab-content hidden">
        <div class="mb-6">
          <h2 class="text-3xl font-bold mb-2 bg-gradient-to-r from-green-400 to-blue-500 bg-clip-text text-transparent">
            All Quizzes Management
          </h2>
          <p class="text-gray-400">View and manage all quizzes in the system.</p>
        </div>
        <div id="quizzes-list"></div>
      </div>

      <div id="stats-tab" class="tab-content hidden">
        <div class="mb-6">
          <h2 class="text-3xl font-bold mb-2 bg-gradient-to-r from-orange-400 to-red-500 bg-clip-text text-transparent">
            System Statistics
          </h2>
          <p class="text-gray-400">Overview of platform activity and metrics.</p>
        </div>
        <div id="stats-content"></div>
      </div>
    </div>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/admin-panel.js"></script>
  <script>
    // User info ve logout
    auth.onAuthStateChanged(user => {
      if (user) {
        const username = user.displayName || user.email.split('@')[0];
        document.getElementById('user-info').textContent = username.toUpperCase();
      }
    });

    document.getElementById('logout-btn').onclick = () => {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    };
  </script>
</body>
</html>
