<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Poll</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center">
  <div class="w-full max-w-md p-2 sm:p-4 md:p-6 rounded-lg bg-gray-800 shadow-lg">
    <h1 class="text-xl sm:text-2xl font-bold mb-3 sm:mb-4 text-center">Create Poll</h1>
    <form id="pollForm" class="flex flex-col gap-2 sm:gap-3">
      <input id="pollName" type="text" placeholder="Poll name" class="mb-2 w-full p-2 rounded bg-gray-700 text-white text-base">
      <input id="pollQuestion" type="text" placeholder="Poll question" class="mb-2 w-full p-2 rounded bg-gray-700 text-white text-base">
      <div id="pollOptions" class="flex flex-col gap-2 sm:gap-3"></div>
      <button type="button" id="addPollOption" class="bg-blue-600 hover:bg-blue-700 w-full p-2 rounded mb-2 text-base">Add Option</button>
      <button type="submit" class="bg-green-600 hover:bg-green-700 w-full p-2 rounded text-base">Save Poll</button>
      <div id="pollMsg" class="mt-2 text-sm"></div>
    </form>
    <a href="main.html" class="block mt-3 sm:mt-4 text-blue-400 underline text-center text-base sm:text-lg">Home</a>
  </div>
  <script src="/js/poll-create.js"></script>
</body>
</html>
