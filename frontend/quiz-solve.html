<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solve Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center">
  <div class="w-full max-w-3xl p-2 sm:p-4 md:p-6 rounded-lg">
    <h1 id="quiz-title" class="text-2xl sm:text-3xl font-bold mb-4 sm:mb-6 text-center bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">Quiz</h1>
    <div id="quiz-content" class="flex flex-col items-center gap-2 sm:gap-4"></div>
    <div class="mt-4 sm:mt-6 text-center">
      <button id="finish-quiz" class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 px-6 py-2 rounded-xl font-bold text-base sm:text-lg shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-105">Quiz'i Bitir</button>
      <div id="result" class="mt-4 text-lg sm:text-xl font-semibold hidden bg-gray-800/50 backdrop-blur-sm p-4 rounded-xl border border-gray-600"></div>
    </div>
    <a id="quiz-back-link" href="main.html" class="block mt-4 sm:mt-6 text-blue-400 hover:text-blue-300 hover:underline text-center text-base sm:text-lg font-medium transition-colors duration-200">Dashboard</a>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/quiz-solve.js"></script>
  <script>
    // Sistem quizlerinde linki ana sayfaya yönlendir
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('system')) {
      const backLink = document.getElementById('quiz-back-link');
      if (backLink) {
        backLink.textContent = 'Back to Home';
        backLink.href = 'main.html';
      }
    }
  </script>
</body>
</html>
